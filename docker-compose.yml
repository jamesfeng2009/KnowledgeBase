# === 企业知识库 Docker Compose ===
# 使用方式：
#   SaaS 模式：docker compose up -d
#   私有部署：DEPLOY_MODE=private_domestic docker compose --profile private up -d

services:
  # === 基础设施层 ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekb
      POSTGRES_PASSWORD: ekb
      POSTGRES_DB: ekb
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekb"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio_data:/data"]

  # === 后端 API ===
  core-engine:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ekb:ekb@postgres:5432/ekb
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OPENSEARCH_URL=http://opensearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ekb123456
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  # === 前端 ===
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      core-engine: { condition: service_healthy }

  # === Yjs 协作服务 ===
  yjs-server:
    build: ./collab-service
    ports: ["8001:8001"]
    environment:
      - DATABASE_URL=postgresql://ekb:ekb@postgres:5432/ekb
      - PORT=8001
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      retries: 5

  # === Celery 异步任务 ===
  celery-worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ekb:ekb@postgres:5432/ekb
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OPENSEARCH_URL=http://opensearch:9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ekb123456
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # === Celery Beat 定时任务 ===
  celery-beat:
    build: ./backend
    command: celery -A celery_app beat --loglevel=info
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://ekb:ekb@postgres:5432/ekb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }

  # === 全文检索（OpenSearch）===
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["os_data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 5

  # === 向量数据库（Milvus）===
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes: ["etcd_data:/etcd/data"]

  milvus-minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes: ["milvus_minio_data:/data"]

  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports: ["19530:19530", "9091:9091"]
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      retries: 5

  # === 知识图谱（Neo4j）===
  neo4j:
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=neo4j/ekb123456
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ekb123456 'RETURN 1' || exit 1"]
      interval: 15s
      retries: 5

  # === 模型服务层（仅私有部署，通过 profile 控制）===
  llm-server:
    image: vllm/vllm-openai:latest
    profiles: ["private"]
    runtime: nvidia
    ports: ["8003:8003"]
    volumes: ["${LLM_MODEL_PATH:-/models/llm}:/model"]
    command: --model /model --quantization awq --tensor-parallel-size 2 --max-model-len 8192 --port 8003
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, capabilities: [gpu], count: 2 }]

  embedding-server:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    profiles: ["private"]
    ports: ["8004:80"]
    volumes: ["/models/bge-m3:/data"]
    command: --model-id BAAI/bge-m3 --port 80
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, capabilities: [gpu], count: 1 }]

  reranker-server:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    profiles: ["private"]
    ports: ["8005:80"]
    volumes: ["${RERANKER_MODEL_PATH:-/models/reranker}:/data"]
    command: --model-id ${RERANKER_MODEL_ID:-jinaai/jina-reranker-v2-base-multilingual} --port 80
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, capabilities: [gpu], count: 1 }]

  vlm-server:
    image: vllm/vllm-openai:latest
    profiles: ["private"]
    runtime: nvidia
    ports: ["8006:8003"]
    volumes: ["${VLM_MODEL_PATH:-/models/vlm}:/model"]
    command: --model /model --quantization awq --tensor-parallel-size 1 --limit-mm-per-prompt image=4 --port 8003
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, capabilities: [gpu], count: 1 }]

volumes:
  pg_data:
  minio_data:
  os_data:
  etcd_data:
  milvus_minio_data:
  neo4j_data:
