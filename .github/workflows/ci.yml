name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, 'feature/**']

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff>=0.8.0

      - name: Run ruff check
        working-directory: backend
        run: ruff check app/ tasks/ tests/ scripts/

      - name: Run ruff format check
        working-directory: backend
        run: ruff format --check app/ tasks/ tests/ scripts/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ekb
          POSTGRES_PASSWORD: ekb
          POSTGRES_DB: ekb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ekb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEPLOY_MODE: saas
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:15432/ekb
      REDIS_URL: redis://localhost:16379/15
      SECRET_KEY: ci-test-secret-key-for-testing-only
      OPENAI_API_KEY: test-dummy-key
      ANTHROPIC_API_KEY: test-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests
        working-directory: backend
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  eval-dataset-validation:
    name: Eval Dataset Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate eval datasets
        working-directory: backend
        run: python scripts/validate_eval_dataset.py eval_datasets/

  # T3: 安全门禁 — RLS 真实隔离 + 漂移检测 + 新表策略覆盖。
  # 关键：RLS 必须用非 superuser 应用角色验证，否则 PostgreSQL 无条件绕过策略，
  # 测出来全是绿的但生产是裸奔的。本 job 先跑迁移建表，再 provision 一个
  # NOSUPERUSER / NOBYPASSRLS 角色，用它连库做真实隔离验证。
  security-gate:
    name: Security Gate (RLS + Drift)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ekb
          POSTGRES_PASSWORD: ekb
          POSTGRES_DB: ekb
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U ekb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # owner 连接（建表/迁移/建角色）— 本地开发同款 superuser
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:15433/ekb
      MIGRATION_DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:15433/ekb
      SECRET_KEY: ci-test-secret-key-for-testing-only
      # 非 superuser 运行角色凭据（供 verify_rls_isolation.py 使用）
      APP_DB_ROLE: ekb_app
      APP_DB_PASSWORD: ci-app-role-password
      APP_DATABASE_URL: postgresql://ekb_app:ci-app-role-password@localhost:15433/ekb

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Apply migrations (owner role)
        working-directory: backend
        run: alembic upgrade head

      - name: Provision non-superuser app role
        working-directory: backend
        run: python scripts/provision_app_role.py --role "$APP_DB_ROLE" --password "$APP_DB_PASSWORD"

      # verify_rls_isolation.py 用真实数据做跨租户对比，空库会因「少于 2 个租户」返回 2。
      # 先灌两租户 × 7 张关键表的最小数据集，门禁才有可比对象（不是放行，是让它真跑）。
      - name: Seed two-tenant RLS gate data
        working-directory: backend
        run: python scripts/seed_rls_gate_data.py --url "$DATABASE_URL"

      - name: Verify RLS isolation under app role (real data, fail-closed)
        working-directory: backend
        run: python scripts/verify_rls_isolation.py --url "$APP_DATABASE_URL" --only-critical

      - name: Check NULL tenant rows
        working-directory: backend
        run: python scripts/check_null_tenant_rows.py --url "$DATABASE_URL"

      - name: Check migration drift (schema vs models)
        working-directory: backend
        run: python scripts/check_migration_drift.py --url "$DATABASE_URL"

      - name: RLS role-split & policy coverage gate
        # 含"新增带 tenant_id 的表未声明 RLS 策略 → 打红"的静态门禁
        working-directory: backend
        run: python -m pytest tests/test_rls_role_split.py -v --tb=short
