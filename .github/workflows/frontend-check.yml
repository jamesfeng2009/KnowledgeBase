name: Frontend Check

on:
  pull_request:
    branches: [main, develop]
    paths: ["frontend/**"]
  push:
    branches: [main]
    paths: ["frontend/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Astro typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci || npm install
      - name: Type check
        run: npx astro check || npm run check
      - name: Build
        run: npm run build
