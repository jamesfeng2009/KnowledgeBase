name: Docs Site Build

on:
  pull_request:
    branches: [main]
    paths: ["docs-site/**", "WeKnora-*.md", "CHANGELOG.md"]
  push:
    branches: [main]
    paths: ["docs-site/**"]

permissions:
  contents: read

jobs:
  docs:
    name: VitePress build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install deps
        run: npm install
      - name: Build docs
        run: npm run build
