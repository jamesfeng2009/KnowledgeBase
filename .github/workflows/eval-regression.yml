name: Eval Regression

on:
  schedule:
    # 每天北京时间 02:00 运行
    - cron: "0 18 * * *"  # UTC 18:00 = CST 02:00
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset path (JSONL file or directory)"
        required: false
        default: "eval_datasets/"
      set_baseline:
        description: "Set this run as baseline"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  eval-regression:
    name: RAG Eval Regression Check
    runs-on: ubuntu-latest
    if: github.repository != ''

    services:
      # P3-11: 此处使用 GitHub Actions 托管 services（跑在 ubuntu-latest x86
      # runner 上），并非 docker-compose 自建服务，故不适用项目硬约束
      # 「Docker 服务须设 platform: linux/arm64」。若后续在本 CI 中引入自建
      # Docker 服务（docker-compose / docker run），必须为每个 service 声明
      # `platform: linux/arm64` 以满足项目硬约束（macOS Apple Silicon 兼容）。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ekb
          POSTGRES_PASSWORD: ekb
          POSTGRES_DB: ekb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ekb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEPLOY_MODE: saas
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:15432/ekb
      REDIS_URL: redis://localhost:16379/15
      SECRET_KEY: eval-regression-secret-key
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-dummy-key' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-dummy-key' }}
      EVAL_REGRESSION_THRESHOLD: "0.05"
      # P3-10: secrets.* 在 if 表达式里始终为 truthy 字符串上下文，
      # `secrets.X != ''` 无法正确判空。改用 env 中转：把原始 secret 值（无 fallback）
      # 暴露到 HAS_OPENAI_KEY，步骤级 if 再判 env.HAS_OPENAI_KEY 是否非空。
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
      # P2-7: 评测裁判/评分模型独立于生成模型，消除自评偏好偏差。
      # 未配置 secrets 时为空字符串 → run_eval.py 回退生成模型并告警偏差。
      EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
      EVAL_RAGAS_MODEL: ${{ secrets.EVAL_RAGAS_MODEL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate eval datasets
        working-directory: backend
        run: python scripts/validate_eval_dataset.py eval_datasets/

      # P1-2：基线跨 run 持久化 — CI 的 Postgres 是临时的，
      # 文件基线（eval_baseline_*.json）通过 actions/cache 在 run 之间传递。
      # 基线仅在手动触发且 set_baseline=true 时更新；定时任务只做对比，
      # 不再每次 --set-baseline（否则基线对比失去意义）。
      - name: Restore eval baseline cache
        uses: actions/cache/restore@v4
        with:
          path: backend/eval_baseline_*.json
          key: eval-baseline-${{ github.run_id }}
          restore-keys: eval-baseline-

      - name: Run eval (retrieval only, no LLM)
        working-directory: backend
        run: |
          DATASET="${{ github.event.inputs.dataset || 'eval_datasets/' }}"
          python scripts/run_eval.py \
            --dataset "$DATASET" \
            --no-generation \
            --baseline latest \
            ${{ github.event.inputs.set_baseline == 'true' && '--set-baseline' || '' }}

      - name: Run eval (full, with generation)
        # P3-10: 改用 env 中转判断 secret 是否存在（secrets.* 在 if 中恒为 truthy）
        if: ${{ env.HAS_OPENAI_KEY != '' }}
        working-directory: backend
        run: |
          DATASET="${{ github.event.inputs.dataset || 'eval_datasets/' }}"
          python scripts/run_eval.py \
            --dataset "$DATASET" \
            --baseline latest \
            ${{ github.event.inputs.set_baseline == 'true' && '--set-baseline' || '' }}

      - name: Save eval baseline cache
        if: ${{ github.event.inputs.set_baseline == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: backend/eval_baseline_*.json
          key: eval-baseline-${{ github.run_id }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            backend/eval_*.json
            backend/eval_*.log
