name: API Smoke Test

on:
  pull_request:
    branches: [main]
    paths: ["backend/app/**", "backend/tests/test_api_smoke.py"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Boot app + health endpoints
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ekb
          POSTGRES_PASSWORD: ekb
          POSTGRES_DB: ekb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:5432/ekb_test
      SECRET_KEY: ci-secret-key
      AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Migrate
        run: alembic upgrade head
      - name: Boot + ping
        run: |
          .venv/bin/uvicorn app.main:app --port 8000 >/tmp/uvicorn.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health || true
          kill $PID || true
