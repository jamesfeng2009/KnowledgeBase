name: Docker Image Build

on:
  pull_request:
    branches: [main]
    paths: ["backend/**", "frontend/**", "Dockerfile*", "docker-compose*.yml"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ekb-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
