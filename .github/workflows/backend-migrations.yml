name: Backend Migrations

on:
  pull_request:
    branches: [main, develop]
    paths: ["backend/alembic/**", "backend/app/models/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    name: Alembic heads consistency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ekb
          POSTGRES_PASSWORD: ekb
          POSTGRES_DB: ekb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:5432/ekb_test
      AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check single head
        run: alembic heads | tee /tmp/heads && test "$(wc -l < /tmp/heads)" -eq 1
      - name: Upgrade head on fresh PG
        run: alembic upgrade head
