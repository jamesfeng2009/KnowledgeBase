name: Backend Migrations

on:
  pull_request:
    branches: [master, develop]
    paths: ["backend/alembic/**", "backend/app/models/**"]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  migrations:
    name: Alembic heads consistency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ekb
          POSTGRES_PASSWORD: ekb
          POSTGRES_DB: ekb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekb" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ekb:ekb@localhost:5432/ekb_test
      AUTO_MIGRATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Check single head
        run: alembic heads | tee /tmp/heads && test "$(wc -l < /tmp/heads)" -eq 1
      - name: Upgrade head on fresh PG
        run: alembic upgrade head
      # 门禁：对"只跑过迁移"的库做一次 autogenerate 对比。
      # 破坏性漂移（remove_index / remove_fk / remove_table / remove_column）与
      # 结构性漂移（add_* / modify_type）一律失败；注释、默认值差异只告警。
      # 背景见 backend/alembic_drift.py 顶部说明。
      - name: Autogenerate drift gate
        run: python scripts/check_migration_drift.py
