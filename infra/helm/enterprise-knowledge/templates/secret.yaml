apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ekb.fullname" . }}-secrets
  labels:
    {{- include "ekb.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.RABBITMQ_PASSWORD | quote }}
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | quote }}
  DASHSCOPE_API_KEY: {{ .Values.secrets.DASHSCOPE_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
