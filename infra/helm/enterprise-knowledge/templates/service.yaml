apiVersion: v1
kind: Service
metadata:
  name: {{ include "ekb.fullname" . }}-core
  labels:
    {{- include "ekb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "ekb.name" . }}-core
  ports:
    - port: 8000
      targetPort: http
      name: http
