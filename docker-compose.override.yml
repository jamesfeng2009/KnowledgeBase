# === 本地开发端口重映射 ===
# 本机 PostgreSQL (5432) 和 Redis (6379) 已在运行，
# 将容器端口映射到高位端口避免冲突。
# 注意：!override 标签用于「替换」而非「追加」端口列表（compose v2.24+）。
# 容器间内部通信仍使用 5432/6379，不受影响。
services:
  postgres:
    ports: !override
      - "15432:5432"

  redis:
    ports: !override
      - "16379:6379"

  # yjs-server 镜像内无 curl/wget，用 node 做健康检查
  yjs-server:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8001/health',(r)=>{process.exit(r.statusCode===200?0:1)})\""]
      interval: 10s
      retries: 5
      start_period: 15s

  # 本地开发：容器异常退出时自动重启
  core-engine:
    restart: unless-stopped

  frontend:
    restart: unless-stopped
